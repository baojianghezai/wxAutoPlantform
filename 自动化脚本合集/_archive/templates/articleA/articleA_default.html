<!doctype html><html lang=zh><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1"></head><body>
<section style="max-width:680px;margin:0 auto;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,'PingFang SC','Microsoft YaHei',sans-serif;color:#1f2d3d;line-height:1.75;background:#fff;box-sizing:border-box;">

  <!-- Hero -->
  <section style="background:linear-gradient(135deg,#1F4E78 0%,#2E6DA4 100%);padding:30px 24px;color:#fff;box-sizing:border-box;">
    <div style="font-size:12px;letter-spacing:3px;opacity:.82;">企业官方招聘 · 信息整理</div>
    <div style="font-size:23px;font-weight:800;margin-top:8px;letter-spacing:1px;">{{COMPANY}}</div>
    <div style="font-size:14px;opacity:.92;margin-top:6px;">{{A_TITLE_SUFFIX}}</div>
  </section>

  <!-- 公司简介 -->
  <section style="padding:22px 22px 4px;box-sizing:border-box;">
    <div style="font-size:17px;font-weight:700;color:#1F4E78;border-left:4px solid #2E6DA4;padding-left:10px;margin-bottom:12px;">公司简介</div>
    {{INTRO}}
  </section>

  <!-- 在招岗位 -->
  <section style="padding:10px 22px;box-sizing:border-box;">
    <div style="font-size:17px;font-weight:700;color:#1F4E78;border-left:4px solid #2E6DA4;padding-left:10px;margin:14px 0 12px;">在招岗位</div>
    {{POSITIONS}}
  </section>

  <!-- 应聘方式 -->
  <section style="padding:10px 22px 4px;box-sizing:border-box;">
    <div style="font-size:17px;font-weight:700;color:#1F4E78;border-left:4px solid #2E6DA4;padding-left:10px;margin:14px 0 12px;">应聘方式</div>
    <div style="font-size:14px;color:#33424f;background:#f5f8fc;border-radius:10px;padding:14px 16px;line-height:1.85;">{{APPLY}}</div>
  </section>

  <!-- 其他信息：截止 / 联系 -->
  <section style="padding:10px 22px 4px;box-sizing:border-box;">
    {{DEADLINE_BLOCK}}
    {{CONTACT_BLOCK}}
  </section>

  <!-- 信息来源 -->
  <section style="padding:12px 22px 26px;box-sizing:border-box;">
    <div style="font-size:12px;color:#8895a3;background:#f7f9fb;border-radius:8px;padding:12px 14px;line-height:1.7;">{{SOURCE_NOTE}}</div>
  </section>

  <!-- 页脚 -->
  <section style="padding:0 22px 28px;text-align:center;font-size:12px;color:#9aa6b2;box-sizing:border-box;">{{FOOTER}}</section>

</section></body></html>
